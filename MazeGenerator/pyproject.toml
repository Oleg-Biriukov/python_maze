[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "0.1.0"
description = "Backtracking maze generator with optional text embedding"
authors = [
    { name = "obirukov", email = "pipipupu2@email.com" },
    { name = "vlprysia", email = "pipipupu@your_email.com" }
]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pydantic>=2.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
    "mypy"
]

[tool.setuptools]
py-modules = ["MazeGenerator"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true